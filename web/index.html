<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunNow</title>
<!-- Simple preview page. The planned Angular front end will replace it. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6e6e73; --accent:#e4572e; --route:#2563eb; --card:#ffffffee; --border:#d2d2d7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1c1c1eee; --border:#3a3a3c; }
  }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; top:16px; left:16px; right:16px; max-width:320px;
           background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:14px 16px; box-shadow:0 4px 20px #0002; }
  h1 { font-size:18px; margin:0 0 4px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 12px; }
  label { display:flex; align-items:center; gap:8px; font-size:14px; }
  input[type=range] { flex:1; }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:8px;
           background:var(--route); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #result { margin-top:12px; font-size:14px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
  .stats b { display:block; font-size:20px; }
  .stats span { color:var(--muted); font-size:12px; }
  .error { color:var(--accent); }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  .search { display:flex; gap:6px; margin-bottom:12px; }
  .search input { flex:1; min-width:0; padding:9px 10px; border:1px solid var(--border); border-radius:8px;
                  background:var(--bg); color:var(--fg); font:inherit; font-size:16px; }
  .search button { margin:0; width:auto; padding:9px 12px; font-size:14px; }
  #matches { list-style:none; margin:-6px 0 12px; padding:0; border:1px solid var(--border);
             border-radius:8px; overflow:hidden; }
  #matches:empty { display:none; }
  #matches li { padding:8px 10px; font-size:13px; cursor:pointer; border-top:1px solid var(--border); }
  #matches li:first-child { border-top:0; }
  #matches li:hover, #matches li:focus { background:var(--border); outline:none; }
  #matches li.empty { cursor:default; color:var(--muted); }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>RunNow</h1>
  <p class="hint">Enter an address or click the map to set your start, pick a distance, then find a loop.</p>
  <form class="search" id="searchForm">
    <input id="address" type="search" placeholder="Enter address" autocomplete="street-address" aria-label="Start address">
    <button id="searchBtn" type="submit">Search</button>
  </form>
  <ul id="matches"></ul>
  <label>Distance <input id="km" type="range" min="1" max="25" step="0.5" value="5"> <span id="kmLabel">5 km</span></label>
  <button id="go" disabled>Find a loop</button>
  <div id="result"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([43.6532, -79.3832], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const kmInput = document.getElementById('km');
const kmLabel = document.getElementById('kmLabel');
const go = document.getElementById('go');
const result = document.getElementById('result');
let start = null, startMarker = null;
const routeLayer = L.layerGroup().addTo(map);

kmInput.oninput = () => kmLabel.textContent = kmInput.value + ' km';

function setStart(latlng) {
  start = latlng;
  if (startMarker) startMarker.setLatLng(start);
  else startMarker = L.marker(start).addTo(map).bindTooltip('Start');
  go.disabled = false;
}

map.on('click', e => { setStart(e.latlng); matches.innerHTML = ''; });

// Address search
const searchForm = document.getElementById('searchForm');
const address = document.getElementById('address');
const searchBtn = document.getElementById('searchBtn');
const matches = document.getElementById('matches');

function chooseMatch(m) {
  setStart(L.latLng(m.lat, m.lon));
  map.setView([m.lat, m.lon], 15);
  address.value = m.name;
  matches.innerHTML = '';
}

function showMessage(text) {
  const li = document.createElement('li');
  li.className = 'empty';
  li.textContent = text;
  matches.replaceChildren(li);
}

searchForm.onsubmit = async e => {
  e.preventDefault();
  const q = address.value.trim();
  if (q.length < 3) return showMessage('Type at least 3 characters.');
  searchBtn.disabled = true; searchBtn.textContent = '…';
  try {
    const res = await fetch('/geocode?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Address lookup failed.');
    if (!data.results.length) return showMessage('No matches in Toronto. Try adding a street number or clicking the map.');
    if (data.results.length === 1) return chooseMatch(data.results[0]);
    matches.replaceChildren(...data.results.map(m => {
      const li = document.createElement('li');
      li.textContent = m.name;  // textContent, never innerHTML, for outside data
      li.tabIndex = 0;
      li.onclick = () => chooseMatch(m);
      li.onkeydown = ev => { if (ev.key === 'Enter') chooseMatch(m); };
      return li;
    }));
  } catch (err) {
    showMessage(err.message);
  } finally {
    searchBtn.disabled = false; searchBtn.textContent = 'Search';
  }
};

go.onclick = async () => {
  go.disabled = true; go.textContent = 'Finding a loop…';
  result.innerHTML = ''; routeLayer.clearLayers();
  try {
    const url = `/loop?lat=${start.lat.toFixed(6)}&lon=${start.lng.toFixed(6)}&km=${kmInput.value}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) {
      const msg = typeof data.detail === 'string' ? data.detail : 'Pick a start point inside Toronto.';
      throw new Error(msg);
    }
    const line = L.geoJSON(data, { style: { color: getComputedStyle(document.documentElement).getPropertyValue('--route'), weight: 5, opacity: .85 } }).addTo(routeLayer);
    for (const [lon, lat] of data.properties.signal_locations) {
      L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#e4572e', fillOpacity: 1 })
        .bindTooltip('Traffic light').addTo(routeLayer);
    }
    // Keep the loop clear of the panel: on wide screens it sits on the left, on phones on top.
    const panel = document.querySelector('.panel').getBoundingClientRect();
    const wide = window.innerWidth > 700;
    map.fitBounds(line.getBounds(), {
      paddingTopLeft: wide ? [panel.right + 24, 40] : [24, panel.bottom + 24],
      paddingBottomRight: [40, 40],
    });
    const p = data.properties;
    result.innerHTML = `
      <div class="stats">
        <div><b>${p.distance_km}</b><span>km</span></div>
        <div><b>${p.signals}</b><span>lights</span></div>
        <div><b>${p.repeated_km}</b><span>km repeated</span></div>
      </div>
      <p class="note">Red dots are traffic lights on the route.</p>`;
  } catch (err) {
    result.innerHTML = `<p class="error">${err.message}</p>`;
  } finally {
    go.disabled = false; go.textContent = 'Find a loop';
  }
};
</script>
</body>
</html>
